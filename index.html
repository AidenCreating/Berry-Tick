<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff3ef"><meta name="description" content="A simple fruit-themed digital clock, set to your device’s time."><title>Fruit clock</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body><main><div class="cherries" aria-hidden="true"><svg viewBox="0 0 200 190" fill="none"><path d="M62 119C67 81 95 69 111 23C112 62 133 89 141 123" stroke="#738957" stroke-width="6" stroke-linecap="round"/><path d="M111 25C91 3 61 11 55 18C68 40 94 45 111 25Z" fill="#9eae7c"/><path d="M109 25C93 22 81 20 69 20" stroke="#7b925c" stroke-width="2" stroke-linecap="round"/><path d="M66 106C41 94 23 111 24 135C25 162 45 177 65 174C88 171 103 154 100 131C98 113 82 101 66 106Z" fill="#cf6475"/><path d="M141 111C117 102 102 122 105 146C108 171 129 183 148 178C170 173 184 153 177 131C171 113 157 107 141 111Z" fill="#b94f64"/><path d="M41 123C36 128 36 137 38 142" stroke="#f8b2b6" stroke-width="6" stroke-linecap="round"/><path d="M120 129C116 133 116 140 118 145" stroke="#ef9ca8" stroke-width="5" stroke-linecap="round"/><path d="M59 111C64 115 72 115 77 111M135 116C140 120 147 120 151 116" stroke="#a5485b" stroke-width="3" stroke-linecap="round"/></svg></div><div class="clock"><time id="time" aria-label="Current device time">--:--<span id="seconds">:--</span></time><span id="period"></span></div><section id="timerControls" class="mode-controls" hidden><form id="durationForm" class="duration-form"><label><input id="minutesInput" type="number" min="0" max="999" value="5" required aria-label="Timer minutes"><span>min</span></label><label><input id="secondsInput" type="number" min="0" max="59" value="0" required aria-label="Timer seconds"><span>sec</span></label><button type="submit" aria-label="Set timer" title="Set timer">✓</button></form><div class="run-controls"><button id="timerReset" aria-label="Reset timer" title="Reset timer">↺</button><button id="timerStart" class="start-button">Start</button></div><span id="timerStatus" role="status"></span></section><section id="stopwatchControls" class="mode-controls" hidden><div class="run-controls"><button id="stopwatchReset" aria-label="Reset stopwatch" title="Reset stopwatch">↺</button><button id="stopwatchStart" class="start-button">Start</button></div></section></main><button id="fullscreen" aria-label="Enter full screen" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button><button id="themeToggle" aria-label="Choose a fruit" aria-haspopup="dialog" aria-expanded="false" aria-controls="fruitPicker" title="Choose a fruit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13c0-5 5-9 12-8 1 7-3 12-8 12-3 0-5-2-5-4Z"/><path d="m4 20 10-10"/></svg></button><dialog id="fruitPicker" aria-label="Choose a fruit"><div class="picker-header"><span>Pick your fruit</span><button id="closePicker" aria-label="Hide fruit picker">×</button></div><div class="fruit-options"></div></dialog><button id="modeToggle" aria-label="Change clock mode" aria-haspopup="dialog" aria-expanded="false" aria-controls="modePicker" title="Clock, timer, stopwatch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></button><dialog id="modePicker" aria-label="Choose a mode"><div class="picker-header"><span>Choose a mode</span><button id="closeMode" aria-label="Hide mode picker">×</button></div><div class="mode-options"><button data-mode="clock" aria-pressed="true"><span>◷</span>Clock</button><button data-mode="timer" aria-pressed="false"><span>◴</span>Timer</button><button data-mode="stopwatch" aria-pressed="false"><span>⏱</span>Stopwatch</button></div></dialog><script src="app.js"></script></body></html>
